[package]
name = "hotaru_trans"
version = "0.8.6"
edition = "2024"
authors = ["Redstone <redstone@fds.moe>"]
description = "Procedural macros for Hotaru framework"
license = "MIT"
repository = "https://github.com/Field-of-Dream-Studio/hotaru"
homepage = "https://hotaru.rs"
categories = ["development-tools::procedural-macro-helpers", "web-programming"]
keywords = ["hotaru", "macros", "proc-macro", "web-framework", "dsl"]

[dependencies]
hotaru_core = { path = "../hotaru_core", version = "=0.8.6" }
cfg-if = "1.0" 
ctor = { version = "0.4.0", optional = true }

[dev-dependencies]
proc-macro2 = "1"
hotaru_http = { path = "../hotaru_http", version = "=0.8.6" }
# The root workspace enables `hotaru_trans/facade` through `hotaru`; keep the
# downstream integration test's generated `::hotaru` paths resolvable.
hotaru = { path = "../hotaru", version = "=0.8.6", default-features = false }

[features]
default = ["trans", "auto-reg"]
external-ctor = ["ctor"]
trans = []
semi-trans = []
attr = []
facade = []
auto-reg = []

[lib]
proc-macro = true
