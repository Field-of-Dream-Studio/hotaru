[package]
name = "htmstd"
version = "0.8.5"
edition = "2024"
authors = ["Redstone <redstone@fds.moe>"] 
description = "Standard middleware library for the Hotaru web framework"
license = "MIT"
repository = "https://github.com/Field-of-Dream-Studio/hotaru"
homepage = "https://hotaru.rs"
categories = ["network-programming", "web-programming::http-server"]
keywords = ["hotaru", "middleware", "session", "cors", "cookies"]

[dependencies]
hotaru_core = { path = "../hotaru_core", version = "=0.8.5" }
hotaru_trans = { path = "../hotaru_trans", version = "=0.8.5", features = ["trans"], default-features = false }
hotaru_http = { path = "../hotaru_http", version = "=0.8.5" }
hotaru_lib = { path = "../hotaru_lib", version = "=0.8.5", features = ["ende", "url_encoding"] }
akari = "0.2.8"
dashmap = "6.1.0"
tokio = { version = "1.28", features = ["full"] }
lazy_static = "1.5.0"
# `hotaru` is pulled in so macro expansions targeting the `::hotaru::…`
# facade path resolve inside this crate. The workspace unifies `hotaru_trans`
# to `facade = on` because `hotaru` requires it; without this dep, htmstd's
# own `middleware!` expansions cannot resolve their emitted paths.
hotaru = { path = "../hotaru", version = "=0.8.5", default-features = false, features = ["trans", "tokio", "http"] }
